name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create releases and attach exe on tag push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (static link, embedded admin manifest + icon)
        shell: cmd
        run: |
          if not exist Build mkdir Build
          rc /nologo /fo app.res app.rc
          cl /nologo /W4 /O2 /MT /EHsc /utf-8 /DUNICODE /D_UNICODE /Fe:Build\BitLockerManager.exe BitLockerManager.cpp app.res /link /SUBSYSTEM:WINDOWS /MANIFEST:EMBED /MANIFESTUAC:NO /MANIFESTINPUT:app.manifest

      - name: Verify exe
        shell: pwsh
        run: |
          if (-not (Test-Path 'Build\BitLockerManager.exe')) { throw 'exe not produced' }
          (Get-Item 'Build\BitLockerManager.exe').VersionInfo | Format-List ProductName, ProductVersion, CompanyName, LegalCopyright

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitLockerManager-${{ github.sha }}
          path: Build/BitLockerManager.exe
          if-no-files-found: error

      - name: Attach exe to release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Build/BitLockerManager.exe
